正文格式:
  主要格式: |
    1. 所有面向用户展示的正文内容（包括旁白、动作、环境描写、角色对话、内心独白），都必须放在唯一的一对 <content> 和 </content> 标签内，非正文内容严禁放入。
    2. 未提及的输出格式要求按原格式输出。

  对话格式: |
    所有角色对话必须用 <dialogue speaker="角色名">对话内容</dialogue> 标签包裹。
    注意: speaker 属性的值必须与角色列表中的名称严格保持一致，禁止自行修改角色名。

  内心格式: |
    所有角色内心独白必须用 <thought speaker="角色名">内心想法</thought> 标签包裹。
    注意: speaker 属性的值必须与角色列表中的名称严格保持一致。

  示例: |
    <content>

    今天天气不错，是个适合出门的好日子。

    <dialogue speaker="小明">你好！</dialogue>
    <thought speaker="小明">我希望今天能有个好心情。</thought>

    </content>
